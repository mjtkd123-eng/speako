<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speako - Offline</title>
    <meta name="theme-color" content="#059669" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 12px 40px -12px rgba(16, 24, 40, 0.22);
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: linear-gradient(135deg, #10b981, #32a4ff);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 36px; height: 36px; color: #fff; }
      h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
      p { font-size: 16px; line-height: 1.6; color: #64748b; margin-bottom: 28px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 9999px;
        background: #059669;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover { background: #047857; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      </div>
      <h1>You're Offline</h1>
      <p>인터넷 연결을 확인하고 다시 시도해 주세요. 오프라인 상태에서는 이전에 방문한 페이지만 볼 수 있어요.</p>
      <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
